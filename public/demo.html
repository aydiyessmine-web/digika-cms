<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Démo - DigiCMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            text-align: center;
        }
        .card .logo {
            width: 80px;
            height: 80px;
            background: #c91818;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            color: white;
            font-weight: 800;
        }
        .card h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .card .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .card .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .card .features .feature {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            color: #1e293b;
        }
        .card .features .feature i {
            display: block;
            font-size: 24px;
            margin-bottom: 4px;
            color: #c91818;
        }
        .card .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #c91818;
            color: white;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .card .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201,24,24,0.3);
        }
        .card .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .card .badge {
            display: inline-block;
            background: #dcfce7;
            color: #16a34a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        @media (max-width: 500px) {
            .card .features {
                grid-template-columns: 1fr;
            }
            .card { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">D</div>
        <h1>DigiCMS Demo</h1>
        <p class="subtitle">Gestion de contenu pour l'affichage dynamique</p>
        
        <div class="badge">✅ Page Web intégrée</div>

        <div class="features">
            <div class="feature">
                <i class="fas fa-images"></i>
                Médias
            </div>
            <div class="feature">
                <i class="fas fa-bullhorn"></i>
                Campagnes
            </div>
            <div class="feature">
                <i class="fas fa-robot"></i>
                Assistant IA
            </div>
            <div class="feature">
                <i class="fas fa-chart-line"></i>
                Statistiques
            </div>
        </div>

        <a href="#" class="btn">Découvrir</a>
        <div class="footer">
            <i class="fas fa-globe"></i> Page intégrée dans la médiathèque
        </div>
    </div>
</body>
</html>
